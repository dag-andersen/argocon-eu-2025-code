apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: product-team
spec:
  namespaceResourceBlacklist:
  - group: 'argoproj.io'
    kind: Application
  sourceRepos:
    - '*'
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  destinations:
  - namespace: '*'
    server: '*'
---